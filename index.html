<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>محرر PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#f3f4f2; --card:#ffffff; --text:#1d2321; --muted:#6b7470; --line:#dfe3e0;
  --accent:#1f6f5c; --accent-text:#ffffff; --danger:#c2412d; --sel:#1f6f5c;
  --radius:14px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151a18; --card:#1f2623; --text:#e8ecea; --muted:#9aa5a0; --line:#2f3834;
    --accent:#4fb59a; --accent-text:#0d1512; --sel:#4fb59a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
header.top h1{font-size:22px;margin:0;font-weight:700}
.back{display:none;border:0;background:var(--card);border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}
body.in-tool .back{display:block}
body.tg .back{display:none!important}

/* Home grid: each tool is a sheet of paper with a folded corner */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tool{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px 18px 6px 6px;padding:16px 14px 14px;text-align:right;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tool::before{content:"";position:absolute;top:-1px;left:-1px;width:22px;height:22px;background:linear-gradient(135deg,var(--bg) 50%,var(--line) 50%);border-radius:6px 0 4px 0}
.tool .ic{font-size:24px;line-height:1}
.tool b{font-size:15.5px;font-weight:700;display:block;margin-top:10px}
.tool small{color:var(--muted);font-size:12.5px;line-height:1.4}
.tool:active{transform:scale(.98)}
.note{color:var(--muted);font-size:13px;margin:18px 2px 0}

/* Tool page */
.panel{display:none}
.panel.on{display:block}
.field{margin:0 0 16px}
.field>label,.lbl{display:block;font-weight:500;margin-bottom:6px;font-size:14.5px}
.hint{color:var(--muted);font-size:12.5px;margin-top:4px}
input[type=text],input[type=number],input[type=password],select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[dir=ltr]{text-align:left}
.row{display:flex;gap:10px}
.row>*{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:500}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:18px;cursor:pointer;background:var(--card);color:var(--muted);text-align:center}
.pick input{display:none}
.pick.has{border-style:solid;color:var(--text)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-text);cursor:pointer;margin-top:8px}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.45}
/* Run button stays pinned to the bottom of the screen while the page list scrolls */
.runbar{position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.runbar .btn{margin-top:0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}

/* Page thumbnails */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin:10px 0}
.th{position:relative;background:var(--card);border:2px solid var(--line);border-radius:6px;cursor:pointer;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.th canvas{max-width:100%;max-height:100%;display:block;background:#fff}
.th span{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;border-radius:5px;padding:0 6px;font-weight:500}
.th.on{border-color:var(--sel)}
.th.on::after{content:"✓";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--sel);color:var(--accent-text);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.thumbs.del .th.on{border-color:var(--danger)}
.thumbs.del .th.on::after{content:"✕";background:var(--danger);color:#fff}
.thumbs.del .th.on canvas{opacity:.35}
.tools-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* File list (merge/images) */
.flist{list-style:none;margin:10px 0 0;padding:0}
.flist li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.flist .nm{unicode-bidi:plaintext;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.flist .n{color:var(--muted);font-size:12px;min-width:18px}
.flist img{width:36px;height:36px;object-fit:cover;border-radius:5px}
.flist button{border:0;background:transparent;font-size:16px;padding:4px 6px;cursor:pointer;color:var(--muted)}

/* Result */
.result{display:none;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.result.on{display:block}
.result h3{margin:0 0 8px;font-size:16px}
.rfile{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.rfile .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;direction:ltr;text-align:right}
.rfile .sz{color:var(--muted);font-size:12px}
.ok{display:none;background:color-mix(in srgb,var(--accent) 14%,var(--card));border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.ok.on{display:block}

/* Busy overlay + modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:360px;text-align:center}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.err{background:color-mix(in srgb,var(--danger) 12%,var(--card));color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;display:none}
.err.on{display:block}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="back" id="backBtn" aria-label="رجوع">→</button>
    <h1 id="title">محرر PDF</h1>
  </header>

  <!-- HOME -->
  <section id="home" class="panel on">
    <div class="grid" id="grid"></div>
    <p class="note">كل المعالجة تتم داخل جهازك. الحد الأقصى لحجم الملف 50 ميغابايت.<br>الإصدار 1.6</p>
  </section>

  <!-- TOOL HOST -->
  <section id="tool" class="panel">
    <div id="form"></div>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <h3>الملف جاهز</h3>
      <div id="rfiles"></div>
      <button class="btn hide" id="sendChat">إرسال إلى المحادثة</button>
      <div class="ok" id="sentMsg"></div>
      <button class="btn sec" id="shareAll">مشاركة / حفظ</button>
      <button class="btn sec" id="dlAll">تنزيل</button>
      <button class="btn sec hide" id="zipAll">تنزيل الكل كملف ZIP</button>
    </div>
  </section>
</div>

<div class="overlay" id="busy"><div class="box"><div class="spin"></div><div id="busyText">جارٍ المعالجة…</div></div></div>
<div class="overlay" id="pwModal"><div class="box">
  <p style="margin:0 0 10px;font-weight:700">هذا الملف محمي بكلمة مرور</p>
  <input type="password" id="pwInput" dir="ltr" placeholder="كلمة المرور">
  <div class="err" id="pwErr">كلمة المرور غير صحيحة، حاول مرة أخرى.</div>
  <button class="btn" id="pwOk">فتح الملف</button>
  <button class="btn sec" id="pwCancel">إلغاء</button>
</div></div>

<script>
'use strict';
const {PDFDocument, degrees, PageSizes} = PDFLib;
const CDN = {
  pdfWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  qpdfJs: 'https://cdn.jsdelivr.net/npm/@neslinesli93/qpdf-wasm@0.3.0/dist/qpdf.js',
  qpdfWasm: 'https://cdn.jsdelivr.net/npm/@neslinesli93/qpdf-wasm@0.3.0/dist/qpdf.wasm'
};
pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;

/* ---------- Telegram integration ---------- */
const TG = window.Telegram && Telegram.WebApp;
const inTG = !!(TG && TG.initData);
if (inTG) {
  document.body.classList.add('tg');
  TG.ready(); TG.expand();
  const tp = TG.themeParams || {}, r = document.documentElement.style;
  if (tp.bg_color) { r.setProperty('--bg', tp.secondary_bg_color || tp.bg_color); r.setProperty('--card', tp.bg_color); }
  if (tp.text_color) r.setProperty('--text', tp.text_color);
  if (tp.hint_color) { r.setProperty('--muted', tp.hint_color); }
  if (tp.button_color) { r.setProperty('--accent', tp.button_color); r.setProperty('--sel', tp.button_color); }
  if (tp.button_text_color) r.setProperty('--accent-text', tp.button_text_color);
  if (tp.section_separator_color) r.setProperty('--line', tp.section_separator_color);
  TG.BackButton.onClick(() => goHome());
}

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const tick = () => new Promise(r => setTimeout(r, 0));
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const baseName = n => (n || 'file').replace(/\.[^.]+$/, '');
const AR_DIGITS = { '٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9,'۰':0,'۱':1,'۲':2,'۳':3,'۴':4,'۵':5,'۶':6,'۷':7,'۸':8,'۹':9 };
const normDigits = s => String(s).replace(/[٠-٩۰-۹]/g, d => AR_DIGITS[d]);
const toInt = s => parseInt(normDigits(s), 10);

class UserError extends Error {}

function busy(on, text) { $('#busy').classList.toggle('on', on); if (text) $('#busyText').textContent = text; }
function showErr(msg) { const e = $('#err'); e.textContent = msg; e.classList.toggle('on', !!msg); }

/* Page-range parsing: "1-3، 5, 8-" → [1,2,3,5,8,...]. Supports Arabic digits/commas. */
function parsePages(str, total, {allowEmpty = false} = {}) {
  const s = normDigits(str || '').replace(/[،,]+/g, ',').replace(/[–—−]/g, '-').trim();
  if (!s) { if (allowEmpty) return []; throw new UserError('اكتب أرقام الصفحات، مثال: 1-3، 5'); }
  const out = [];
  for (let tok of s.split(/[,\s]+/)) {
    if (!tok) continue;
    let m;
    if ((m = tok.match(/^(\d+)?-(\d+)?$/))) {
      const a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : total;
      check(a); check(b);
      if (a <= b) for (let i = a; i <= b; i++) out.push(i); else for (let i = a; i >= b; i--) out.push(i);
    } else if (/^\d+$/.test(tok)) { check(+tok); out.push(+tok); }
    else throw new UserError('صيغة غير مفهومة: «' + tok + '». استخدم أرقاماً مثل 1-3، 5');
  }
  return out;
  function check(n) { if (n < 1 || n > total) throw new UserError('الصفحة ' + n + ' غير موجودة. عدد صفحات الملف ' + total + '.'); }
}
const uniqSorted = a => [...new Set(a)].sort((x, y) => x - y);
function compressPages(list) {
  const a = uniqSorted(list), parts = [];
  for (let i = 0; i < a.length; i++) {
    let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    parts.push(i === j ? '' + a[i] : a[i] + '-' + a[j]); i = j;
  }
  return parts.join('، ');
}

/* ---------- qpdf (passwords) ---------- */
let qpdfLoader = null;
function loadQpdfScript() {
  if (!qpdfLoader) qpdfLoader = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = CDN.qpdfJs;
    s.onload = () => res(window.Module); s.onerror = () => rej(new UserError('تعذّر تحميل أداة كلمات المرور. تحقق من الإنترنت.'));
    document.head.appendChild(s);
  });
  return qpdfLoader;
}
async function runQpdf(input, args) {
  const factory = await loadQpdfScript();
  let log = '';
  const q = await factory({ locateFile: () => CDN.qpdfWasm, print: t => log += t + '\n', printErr: t => log += t + '\n' });
  q.FS.writeFile('/in.pdf', input);
  let code;
  try { code = q.callMain([...args.map(a => a === '$IN' ? '/in.pdf' : a === '$OUT' ? '/out.pdf' : a)]); }
  catch (e) { code = e && typeof e.status === 'number' ? e.status : 2; }
  let out = null;
  try { out = q.FS.readFile('/out.pdf'); } catch (e) {}
  return { code, out, log };
}
async function qpdfDecrypt(bytes, password) {
  const r = await runQpdf(bytes, ['--password=' + password, '--decrypt', '$IN', '$OUT']);
  if (r.out && r.out.length && (r.code === 0 || r.code === 3)) return r.out;
  return null; /* qpdf exits with 2 on a wrong password */
}

/* ---------- Opening PDFs (handles protected files) ---------- */
function askPassword(fileName) {
  return new Promise(resolve => {
    const m = $('#pwModal'), inp = $('#pwInput');
    inp.value = ''; $('#pwErr').classList.remove('on'); m.classList.add('on'); setTimeout(() => inp.focus(), 50);
    const done = v => { m.classList.remove('on'); $('#pwOk').onclick = $('#pwCancel').onclick = null; resolve(v); };
    $('#pwOk').onclick = () => done(inp.value);
    $('#pwCancel').onclick = () => done(null);
    inp.onkeydown = e => { if (e.key === 'Enter') done(inp.value); };
  });
}
async function readBytes(file) { return new Uint8Array(await file.arrayBuffer()); }
function isEncErr(e) { return /encrypted/i.test(e && e.message || ''); }
/* Returns {bytes, doc} with any password removed so every tool can edit it. */
async function openPdf(file, {keepEncrypted = false} = {}) {
  let bytes = await readBytes(file);
  try { return { bytes, doc: await PDFDocument.load(bytes, { updateMetadata: false }), wasEncrypted: false }; }
  catch (e) {
    if (!isEncErr(e)) throw new UserError('تعذّر فتح «' + file.name + '». تأكد أنه ملف PDF سليم.');
  }
  if (keepEncrypted) return { bytes, doc: null, wasEncrypted: true };
  busy(true, 'فك حماية الملف…');
  let dec = await qpdfDecrypt(bytes, '');
  busy(false);
  let firstTry = true;
  while (!dec) {
    const pw = await askPassword(file.name);
    if (pw === null) throw new UserError('الملف محمي ولم تُدخل كلمة المرور.');
    busy(true, 'فك حماية الملف…');
    dec = await qpdfDecrypt(bytes, pw);
    busy(false);
    if (!dec) { firstTry = false; setTimeout(() => $('#pwErr').classList.add('on'), 60); }
  }
  return { bytes: dec, doc: await PDFDocument.load(dec, { updateMetadata: false }), wasEncrypted: true };
}

/* ---------- Images ---------- */
function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => res({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); rej(new UserError('تعذّر قراءة الصورة «' + file.name + '». الصيغ المدعومة: JPG، PNG، WEBP، GIF، BMP.')); };
    img.src = url;
  });
}
/* Re-encode through a canvas: fixes phone photo orientation and supports any browser-readable format. */
async function imageToEmbeddable(file, maxDim, quality) {
  const { img, url } = await loadImg(file);
  let w = img.naturalWidth, h = img.naturalHeight;
  const k = maxDim ? Math.min(1, maxDim / Math.max(w, h)) : 1;
  w = Math.round(w * k); h = Math.round(h * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const isPng = /png|gif|webp/i.test(file.type);
  if (!isPng) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  const type = isPng ? 'image/png' : 'image/jpeg';
  const blob = await new Promise(r => c.toBlob(r, type, quality));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), type, w, h };
}
async function embedImage(doc, file, maxDim, quality) {
  const e = await imageToEmbeddable(file, maxDim, quality);
  return e.type === 'image/png' ? doc.embedPng(e.bytes) : doc.embedJpg(e.bytes);
}
function addImagePage(doc, img, mode, index) {
  /* mode: {fit:'image'} or {w,h,margin} */
  let page;
  if (mode.fit === 'image') {
    page = index == null ? doc.addPage([img.width, img.height]) : doc.insertPage(index, [img.width, img.height]);
    page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
  } else {
    let W = mode.w, H = mode.h;
    if (mode.auto && (img.width > img.height) !== (W > H)) [W, H] = [H, W];
    page = index == null ? doc.addPage([W, H]) : doc.insertPage(index, [W, H]);
    const m = mode.margin || 0, s = Math.min((W - 2 * m) / img.width, (H - 2 * m) / img.height);
    const w = img.width * s, hh = img.height * s;
    page.drawImage(img, { x: (W - w) / 2, y: (H - hh) / 2, width: w, height: hh });
  }
  return page;
}

/* ---------- Output ---------- */
const pdfOut = async (doc, name) => ({ name, blob: new Blob([await doc.save()], { type: 'application/pdf' }) });
const SIZES = { A3: PageSizes.A3, A4: PageSizes.A4, A5: PageSizes.A5, Letter: PageSizes.Letter, Legal: PageSizes.Legal };
const mm = v => v * 72 / 25.4;
const MAX_FILE = 50 * 1024 * 1024;

/* ================= OPERATIONS (pure: files/options in → files out) ================= */
const OPS = {
  async remove({ file, pages }) {
    const { doc } = await openPdf(file), total = doc.getPageCount();
    const del = uniqSorted(pages);
    if (!del.length) throw new UserError('اختر الصفحات التي تريد حذفها.');
    if (del.length >= total) throw new UserError('لا يمكن حذف كل الصفحات. اترك صفحة واحدة على الأقل.');
    for (let i = del.length - 1; i >= 0; i--) doc.removePage(del[i] - 1);
    return [await pdfOut(doc, baseName(file.name) + '-edited.pdf')];
  },

  async insert({ file, after, srcType, srcFile, srcPages, images, imgSize }) {
    const { doc } = await openPdf(file), total = doc.getPageCount();
    if (!(after >= 0 && after <= total)) throw new UserError('موضع الإضافة يجب أن يكون بين 0 و ' + total + '.');
    let at = after;
    if (srcType === 'pdf') {
      if (!srcFile) throw new UserError('اختر ملف PDF الذي ستُؤخذ منه الصفحات.');
      const src = (await openPdf(srcFile)).doc, n = src.getPageCount();
      const list = srcPages && srcPages.trim() ? parsePages(srcPages, n) : [...Array(n).keys()].map(i => i + 1);
      const copied = await doc.copyPages(src, list.map(p => p - 1));
      for (const p of copied) doc.insertPage(at++, p);
    } else {
      if (!images || !images.length) throw new UserError('اختر صورة واحدة على الأقل.');
      const ref = doc.getPage(Math.min(Math.max(after - 1, 0), total - 1)).getSize();
      for (let i = 0; i < images.length; i++) {
        busy(true, 'إضافة الصورة ' + (i + 1) + ' من ' + images.length + '…'); await tick();
        const img = await embedImage(doc, images[i], 2400, 0.9);
        addImagePage(doc, img, imgSize === 'image' ? { fit: 'image' } : { w: ref.width, h: ref.height, margin: 0 }, at++);
      }
    }
    return [await pdfOut(doc, baseName(file.name) + '-edited.pdf')];
  },

  async rotate({ file, pages, angle }) {
    const { doc } = await openPdf(file);
    const list = pages && pages.length ? uniqSorted(pages) : doc.getPages().map((_, i) => i + 1);
    for (const n of list) { const p = doc.getPage(n - 1); p.setRotation(degrees(((p.getRotation().angle + angle) % 360 + 360) % 360)); }
    return [await pdfOut(doc, baseName(file.name) + '-rotated.pdf')];
  },

  async resize({ file, size, cw, ch, orient, margin }) {
    const { doc } = await openPdf(file);
    let [W, H] = size === 'custom' ? [mm(cw), mm(ch)] : SIZES[size];
    if (!(W > 10 && H > 10)) throw new UserError('اكتب عرضاً وارتفاعاً صحيحين بالمليمتر.');
    if (W > H) [W, H] = [H, W];
    const M = mm(margin || 0);
    for (const page of doc.getPages()) {
      const box = page.getCropBox(), rot = page.getRotation().angle % 360;
      const sideways = rot === 90 || rot === 270;
      const vw = sideways ? box.height : box.width, vh = sideways ? box.width : box.height; /* as the reader sees it */
      let tw = W, th = H;
      if (orient === 'landscape' || (orient === 'auto' && vw > vh)) [tw, th] = [H, W];
      if (sideways) [tw, th] = [th, tw]; /* back to the page's own (unrotated) space */
      const s = Math.min((tw - 2 * M) / box.width, (th - 2 * M) / box.height);
      const dx = (tw - box.width * s) / 2 - box.x * s, dy = (th - box.height * s) / 2 - box.y * s;
      page.scaleContent(s, s);
      page.translateContent(dx, dy);
      page.scaleAnnotations(s, s);
      page.setMediaBox(0, 0, tw, th); page.setCropBox(0, 0, tw, th);
      page.setBleedBox(0, 0, tw, th); page.setTrimBox(0, 0, tw, th); page.setArtBox(0, 0, tw, th);
    }
    return [await pdfOut(doc, baseName(file.name) + '-' + (size === 'custom' ? 'custom' : size) + '.pdf')];
  },

  async watermark({ file, kind, text, color, imgFile, opacity, sizePct, angle, place, pages }) {
    const { doc } = await openPdf(file);
    let wm;
    if (kind === 'text') {
      if (!text || !text.trim()) throw new UserError('اكتب نص العلامة المائية.');
      wm = await doc.embedPng(await textToPng(text.trim(), color));
    } else {
      if (!imgFile) throw new UserError('اختر صورة العلامة المائية.');
      wm = await embedImage(doc, imgFile, 1600, 0.92);
    }
    const list = pages && pages.length ? uniqSorted(pages) : doc.getPages().map((_, i) => i + 1);
    for (const n of list) {
      const page = doc.getPage(n - 1), box = page.getCropBox(), rot = page.getRotation().angle % 360;
      const sideways = rot === 90 || rot === 270;
      const visW = sideways ? box.height : box.width;
      const w = visW * sizePct / 100, hh = w * wm.height / wm.width;
      const a = angle + rot, rad = a * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
      const drawAt = (cx, cy) => page.drawImage(wm, {
        x: cx - (w / 2 * cos - hh / 2 * sin), y: cy - (w / 2 * sin + hh / 2 * cos),
        width: w, height: hh, rotate: degrees(a), opacity: opacity / 100
      });
      const cx = box.x + box.width / 2, cy = box.y + box.height / 2;
      if (place === 'tile') {
        const step = Math.max(w, hh) * 1.15;
        for (let y = box.y; y < box.y + box.height + step; y += step)
          for (let x = box.x; x < box.x + box.width + step; x += step) drawAt(x, y);
      } else if (place === 'center') drawAt(cx, cy);
      else {
        /* top / bottom as the reader sees the page */
        const off = (sideways ? box.width : box.height) / 2 - hh * 0.9 - 18;
        const sign = place === 'top' ? 1 : -1;
        const vx = { 0: [0, 1], 90: [1, 0], 180: [0, -1], 270: [-1, 0] }[rot] || [0, 1];
        drawAt(cx + vx[0] * off * sign, cy + vx[1] * off * sign);
      }
    }
    return [await pdfOut(doc, baseName(file.name) + '-watermark.pdf')];
  },

  async merge({ files }) {
    if (!files || files.length < 2) throw new UserError('اختر ملفين على الأقل للدمج.');
    const out = await PDFDocument.create();
    for (let i = 0; i < files.length; i++) {
      busy(true, 'دمج الملف ' + (i + 1) + ' من ' + files.length + '…'); await tick();
      const src = (await openPdf(files[i])).doc;
      for (const p of await out.copyPages(src, src.getPageIndices())) out.addPage(p);
    }
    return [await pdfOut(out, baseName(files[0].name) + '-merged.pdf')];
  },

  async images2pdf({ images, size, margin, quality }) {
    if (!images || !images.length) throw new UserError('اختر صورة واحدة على الأقل.');
    const q = { high: [3000, 0.92], mid: [2000, 0.82], low: [1400, 0.7] }[quality] || [3000, 0.92];
    const doc = await PDFDocument.create();
    for (let i = 0; i < images.length; i++) {
      busy(true, 'تحويل الصورة ' + (i + 1) + ' من ' + images.length + '…'); await tick();
      const img = await embedImage(doc, images[i], q[0], q[1]);
      if (size === 'image') addImagePage(doc, img, { fit: 'image' });
      else { const [W, H] = SIZES[size]; addImagePage(doc, img, { w: W, h: H, margin: mm(margin || 0), auto: true }); }
    }
    return [await pdfOut(doc, baseName(images[0].name) + '.pdf')];
  },

  async pdf2images({ file, pages, format, scale }) {
    const { bytes, doc } = await openPdf(file);
    const list = pages && pages.length ? uniqSorted(pages) : doc.getPages().map((_, i) => i + 1);
    const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    const out = [], ext = format === 'png' ? 'png' : 'jpg', mime = format === 'png' ? 'image/png' : 'image/jpeg';
    for (let i = 0; i < list.length; i++) {
      busy(true, 'تحويل الصفحة ' + list[i] + ' (' + (i + 1) + ' من ' + list.length + ')…'); await tick();
      const pg = await pdf.getPage(list[i]);
      let vp = pg.getViewport({ scale });
      const maxSide = 6000; if (Math.max(vp.width, vp.height) > maxSide) vp = pg.getViewport({ scale: scale * maxSide / Math.max(vp.width, vp.height) });
      const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: ctx, viewport: vp }).promise;
      const blob = await new Promise(r => c.toBlob(r, mime, 0.92));
      out.push({ name: baseName(file.name) + '-p' + list[i] + '.' + ext, blob });
      c.width = c.height = 0; pg.cleanup();
    }
    await pdf.destroy();
    return out;
  },

  async split({ file, mode, every, groups, pages }) {
    const { doc } = await openPdf(file), total = doc.getPageCount(), b = baseName(file.name);
    let sets = [];
    if (mode === 'every') {
      const n = toInt(every);
      if (!(n >= 1)) throw new UserError('اكتب عدد الصفحات في كل ملف.');
      for (let i = 1; i <= total; i += n) sets.push([...Array(Math.min(n, total - i + 1)).keys()].map(k => i + k));
    } else if (mode === 'ranges') {
      const parts = normDigits(groups || '').split(/[;؛\n|]+/).map(s => s.trim()).filter(Boolean);
      if (!parts.length) throw new UserError('اكتب النطاقات، مثال: 1-3؛ 4-7؛ 8-10');
      sets = parts.map(p => parsePages(p, total));
    } else {
      if (!pages || !pages.length) throw new UserError('اختر الصفحات التي تريد استخراجها.');
      sets = [uniqSorted(pages)];
    }
    const out = [];
    for (let i = 0; i < sets.length; i++) {
      busy(true, 'إنشاء الملف ' + (i + 1) + ' من ' + sets.length + '…'); await tick();
      const d = await PDFDocument.create();
      for (const p of await d.copyPages(doc, sets[i].map(n => n - 1))) d.addPage(p);
      const label = mode === 'extract' ? 'extract' : (sets[i].length === 1 ? 'p' + sets[i][0] : 'p' + sets[i][0] + '-' + sets[i][sets[i].length - 1]);
      out.push(await pdfOut(d, b + '-' + label + '.pdf'));
    }
    return out;
  },

  async protect({ file, pw, pw2, restrict }) {
    if (!pw) throw new UserError('اكتب كلمة المرور.');
    if (pw !== pw2) throw new UserError('كلمتا المرور غير متطابقتين.');
    const { bytes } = await openPdf(file);
    busy(true, 'تشفير الملف…');
    const owner = restrict ? pw + '#' + Math.random().toString(36).slice(2, 10) : pw;
    const args = ['--encrypt', pw, owner, '256'];
    if (restrict) args.push('--print=none', '--modify=none', '--extract=n');
    args.push('--', '$IN', '$OUT');
    const r = await runQpdf(bytes, args);
    if (!r.out || r.code === 2) throw new UserError('تعذّر تشفير الملف.');
    return [{ name: baseName(file.name) + '-protected.pdf', blob: new Blob([r.out], { type: 'application/pdf' }) }];
  },

  async unprotect({ file, pw }) {
    const bytes = await readBytes(file);
    try { await PDFDocument.load(bytes, { updateMetadata: false }); throw new UserError('هذا الملف غير محمي بكلمة مرور أصلاً.'); }
    catch (e) { if (e instanceof UserError) throw e; if (!isEncErr(e)) throw new UserError('تعذّر فتح الملف. تأكد أنه PDF سليم.'); }
    busy(true, 'إزالة الحماية…');
    let out = await qpdfDecrypt(bytes, pw || '');
    if (!out) throw new UserError('كلمة المرور غير صحيحة.');
    return [{ name: baseName(file.name) + '-unlocked.pdf', blob: new Blob([out], { type: 'application/pdf' }) }];
  }
};

/* Text watermark rendered by the browser so Arabic letters join correctly. */
async function textToPng(text, color) {
  const fs = 160, font = '700 ' + fs + 'px "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif';
  try { await document.fonts.load(font, text); } catch (e) {}
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  ctx.font = font; ctx.direction = 'rtl';
  const lines = text.split('\n'), w = Math.max(...lines.map(l => ctx.measureText(l).width));
  c.width = Math.ceil(w + fs * 0.4); c.height = Math.ceil(lines.length * fs * 1.35 + fs * 0.2);
  ctx.font = font; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  lines.forEach((l, i) => ctx.fillText(l, c.width / 2, fs * 0.1 + fs * 1.35 * (i + 0.5)));
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}

/* ================= UI BUILDING BLOCKS ================= */
function filePicker(label, accept, multiple, onChange) {
  const el = h(`<label class="pick"><input type="file" accept="${accept}" ${multiple ? 'multiple' : ''}><span>${label}</span></label>`);
  const inp = $('input', el);
  inp.onchange = () => {
    const files = [...inp.files]; if (!files.length) return;
    const big = files.find(f => f.size > MAX_FILE);
    if (big) { inp.value = ''; showErr('حجم «' + big.name + '» ' + fmtSize(big.size) + '، والحد الأقصى 50 ميغابايت.'); return; }
    showErr('');
    if (!multiple) { el.classList.add('has'); const sp = $('span', el); sp.textContent = '📄 '; const b = document.createElement('bdi'); b.textContent = files[0].name; sp.appendChild(b); }
    onChange(multiple ? files : files[0]); inp.value = '';
  };
  return el;
}

/* Sortable list for merge / images */
function fileList(isImage) {
  const box = h('<div><ul class="flist"></ul></div>'), ul = $('ul', box), items = [];
  const render = () => {
    ul.innerHTML = '';
    items.forEach((f, i) => {
      const li = h(`<li><span class="n">${i + 1}</span>${isImage ? '<img alt="">' : '📄'}<span class="nm"></span>
        <button aria-label="أعلى">▲</button><button aria-label="أسفل">▼</button><button aria-label="حذف">✕</button></li>`);
      $('.nm', li).textContent = f.name;
      if (isImage) { const u = URL.createObjectURL(f); $('img', li).src = u; $('img', li).onload = () => URL.revokeObjectURL(u); }
      const [up, dn, rm] = li.querySelectorAll('button');
      up.onclick = () => { if (i > 0) { [items[i - 1], items[i]] = [items[i], items[i - 1]]; render(); } };
      dn.onclick = () => { if (i < items.length - 1) { [items[i + 1], items[i]] = [items[i], items[i + 1]]; render(); } };
      rm.onclick = () => { items.splice(i, 1); render(); };
      ul.appendChild(li);
    });
  };
  return { el: box, add: fs => { items.push(...fs); render(); }, get: () => items.slice() };
}

/* Thumbnail grid + range box, kept in sync */
function pagePicker({ danger = false, label = 'الصفحات', hint = 'اضغط على الصفحات أو اكتب أرقامها، مثال: 1-3، 5', emptyMeansAll = false } = {}) {
  const el = h(`<div class="field hide">
    <label class="lbl">${label}</label>
    <input type="text" inputmode="text" placeholder="${emptyMeansAll ? 'اتركه فارغاً لكل الصفحات' : 'مثال: 1-3، 5'}">
    <div class="hint">${hint}</div>
    <div class="tools-row"><button type="button" class="mini" data-a="all">تحديد الكل</button><button type="button" class="mini" data-a="none">إلغاء التحديد</button><button type="button" class="mini" data-a="inv">عكس التحديد</button></div>
    <div class="thumbs ${danger ? 'del' : ''}"></div></div>`);
  const inp = $('input', el), grid = $('.thumbs', el);
  let total = 0, sel = new Set(), pdf = null, obs = null;
  const paint = () => grid.querySelectorAll('.th').forEach(t => t.classList.toggle('on', sel.has(+t.dataset.p)));
  const syncText = () => { inp.value = compressPages([...sel]); };
  inp.oninput = () => { try { sel = new Set(parsePages(inp.value, total, { allowEmpty: true })); paint(); } catch (e) {} };
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'all') sel = new Set([...Array(total).keys()].map(i => i + 1));
    if (a === 'none') sel = new Set();
    if (a === 'inv') sel = new Set([...Array(total).keys()].map(i => i + 1).filter(n => !sel.has(n)));
    paint(); syncText();
  });
  let queue = Promise.resolve();
  const renderThumb = (t) => {
    queue = queue.then(async () => {
      if (!pdf || t.dataset.done) return; t.dataset.done = 1;
      const pg = await pdf.getPage(+t.dataset.p), vp0 = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: 180 / Math.max(vp0.width, vp0.height) });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      t.prepend(c); pg.cleanup();
    }).catch(() => {});
  };
  return {
    el,
    async load(bytes, n) {
      total = n; sel = new Set(); inp.value = ''; grid.innerHTML = ''; el.classList.remove('hide');
      if (obs) obs.disconnect(); if (pdf) pdf.destroy();
      pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
      obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { renderThumb(e.target); obs.unobserve(e.target); } }), { rootMargin: '300px' });
      for (let i = 1; i <= n; i++) {
        const t = h(`<div class="th" data-p="${i}" role="button" aria-label="صفحة ${i}"><span>${i}</span></div>`);
        t.onclick = () => { sel.has(i) ? sel.delete(i) : sel.add(i); t.classList.toggle('on'); syncText(); };
        grid.appendChild(t); obs.observe(t);
      }
    },
    get() { if (!total) return []; const v = inp.value.trim(); if (!v) return emptyMeansAll ? [] : []; return parsePages(v, total); },
    total: () => total
  };
}

function seg(options, value, onChange) {
  const el = h('<div class="seg"></div>');
  let cur = value;
  options.forEach(([v, t]) => {
    const b = h(`<button type="button">${t}</button>`); if (v === value) b.classList.add('on');
    b.onclick = () => { cur = v; el.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); onChange && onChange(v); };
    el.appendChild(b);
  });
  return { el, get: () => cur };
}
function field(label, inner, hint) {
  const f = h(`<div class="field"><label class="lbl">${label}</label></div>`);
  f.appendChild(inner instanceof Node ? inner : h(inner));
  if (hint) f.appendChild(h(`<div class="hint">${hint}</div>`));
  return f;
}

/* Loads a PDF into a picker after the user selects it */
async function attachPdf(file, picker, after) {
  showErr('');
  try {
    busy(true, 'فتح الملف…');
    const r = await openPdf(file);
    busy(true, 'عرض الصفحات…');
    if (picker) await picker.load(r.bytes, r.doc.getPageCount());
    after && after(r);
  } catch (e) { handleErr(e); } finally { busy(false); }
}

/* ================= NAVIGATION + RUN ================= */
const grid = $('#grid');

  const b = h(`<button class="tool" type="button"><span class="ic">${t.ic}</span><span><b>${t.t}</b><small>${t.d}</small></span></button>`);

});
let current = null, results = [];

  $('#title').textContent = t.ic + ' ' + t.t; showErr(''); $('#result').classList.remove('on');
  const f = $('#form'); f.innerHTML = '';
  const getOpts = t.build(f);
  const bar = h('<div class="runbar"><button class="btn" type="button">تنفيذ</button></div>'), run = $('button', bar);
  run.onclick = async () => {
    showErr(''); $('#result').classList.remove('on');

  $('#title').textContent = 'محرر PDF'; if (inTG) TG.BackButton.hide(); current = null;

$('#backBtn').onclick = goHome;
function handleErr(e) {
  busy(false);
  console.error(e);
  showErr(e instanceof UserError ? e.message : 'حدث خطأ أثناء المعالجة: ' + (e && e.message || e) + '. إذا كان الملف كبيراً جداً فجرّب ملفاً أصغر.');
  $('#err').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- Saving results ---------- */
function showResult(files) {
  const box = $('#rfiles'); box.innerHTML = '';
  $('#result h3').textContent = files.length > 1 ? 'جاهز: ' + files.length + ' ملفات' : 'الملف جاهز';
  files.forEach(f => {
    const r = h(`<div class="rfile"><span class="nm"></span><span class="sz">${fmtSize(f.blob.size)}${f.blob.size > MAX_FILE ? ' ⚠️' : ''}</span><button class="mini" type="button">حفظ</button></div>`);
    $('.nm', r).textContent = f.name;
    $('button', r).onclick = () => saveFiles([f]);
    box.appendChild(r);
  });
  $('#zipAll').classList.toggle('hide', files.length < 2);
  $('#sendChat').classList.toggle('hide', !canSend());
  $('#sendChat').textContent = files.length > 1 ? 'إرسال الكل إلى المحادثة' : 'إرسال إلى المحادثة';
  $('#shareAll').classList.toggle('sec', canSend());
  $('#sentMsg').classList.remove('on');
  $('#shareAll').textContent = files.length > 1 ? 'مشاركة / حفظ الكل' : 'مشاركة / حفظ';
  $('#dlAll').textContent = files.length > 1 ? 'تنزيل الكل' : 'تنزيل';
  $('#result').classList.add('on');
  $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
const toFile = f => new File([f.blob], f.name, { type: f.blob.type });
async function saveFiles(files) {
  /* 1) Share sheet (best on phones)  2) normal download */
  try {
    const fl = files.map(toFile);
    if (navigator.canShare && navigator.canShare({ files: fl })) { await navigator.share({ files: fl }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  download(files);
}
function download(files) {
  files.forEach((f, i) => setTimeout(() => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(f.blob); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }, i * 400));
}
$('#shareAll').onclick = () => saveFiles(results);
$('#dlAll').onclick = () => download(results);
$('#zipAll').onclick = async () => {
  busy(true, 'تجهيز ملف ZIP…');
  try { const z = new JSZip(); results.forEach(f => z.file(f.name, f.blob)); const blob = await z.generateAsync({ type: 'blob' }); download([{ name: 'files.zip', blob }]); }
  catch (e) { handleErr(e); } finally { busy(false); }
};

/* ---------- Send to the Telegram chat (via the bot's Serverless endpoint) ---------- */
/* Telegram only accepts endpoint calls from its own address, so a tiny invisible helper page
   hosted there (bridge) makes the call for us. Editing still happens here on GitHub. */
const BRIDGE_ORIGIN = 'https://app8362779333.tgcloud.ai';
const canSend = () => inTG && !!TG.initData;
let bridgeP = null, bridgeSeq = 0;
const bridgeWait = {};
addEventListener('message', ev => {
  if (ev.origin !== BRIDGE_ORIGIN || !ev.data || ev.data.type !== 'result') return;
  const w = bridgeWait[ev.data.id]; if (!w) return;
  delete bridgeWait[ev.data.id]; w(ev.data.data);
});
function getBridge() {
  if (bridgeP) return bridgeP;
  bridgeP = new Promise((resolve, reject) => {
    const fr = document.createElement('iframe');
    fr.src = BRIDGE_ORIGIN + '/'; fr.title = 'send'; fr.style.cssText = 'position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none';
    const t = setTimeout(() => { bridgeP = null; fr.remove(); reject({ type: 'BRIDGE', message: 'تعذّر الاتصال بخادم الإرسال. تحقق من الإنترنت.' }); }, 20000);
    const onReady = ev => {
      if (ev.origin !== BRIDGE_ORIGIN || !ev.data || ev.data.type !== 'ready') return;
      clearTimeout(t); removeEventListener('message', onReady); resolve(fr.contentWindow);
    };
    addEventListener('message', onReady);
    document.body.appendChild(fr);
  });
  return bridgeP;
}
async function callEndpoint(name, input) {
  const win = await getBridge(), id = ++bridgeSeq;
  const d = await new Promise((resolve, reject) => {
    const t = setTimeout(() => { delete bridgeWait[id]; reject({ type: 'TIMEOUT', message: 'انتهت مهلة الإرسال.' }); }, 60000);
    bridgeWait[id] = r => { clearTimeout(t); resolve(r); };
    win.postMessage({ type: 'call', id, name, input, initData: TG.initData }, BRIDGE_ORIGIN);
  });
  if (!d.ok) throw { type: d.error_type || 'ERROR', message: d.description || 'خطأ غير معروف' };
  return d.result;
}
function bytesToB64(b) {
  let s = ''; for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode.apply(null, b.subarray(i, i + 32768));
  return btoa(s);
}
/* Telegram refuses bursts of requests (and possibly large ones) without saying why.
   So pieces are paced, and a refused piece is retried after a growing pause; the piece size is
   halved on every second refusal (never below 32 KB). Sizes that work are remembered. */
let chunkSize = 192 * 1024;
const MIN_CHUNK = 32 * 1024, MAX_TRIES = 9, PACE_MS = 350;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const sizeRefused = e => e && (e.type === 'HTTP' || e.type === 'INTERNAL' || e.type === 'NETWORK' || e.type === 'TIMEOUT');
async function sendToChat(files) {
  const msg = $('#sentMsg'); msg.classList.remove('on'); showErr('');
  const tooBig = files.find(f => f.blob.size > MAX_FILE);
  if (tooBig) { showErr('«' + tooBig.name + '» أكبر من 50 ميغابايت، ولا يمكن إرساله إلى المحادثة. استخدم «تنزيل» بدلاً من ذلك.'); return; }
  try {
    for (let k = 0; k < files.length; k++) {
      const f = files[k], bytes = new Uint8Array(await f.blob.arrayBuffer());
      const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
      let off = 0, index = 0, tries = 0;
      while (off < bytes.length || index === 0) {
        busy(true, 'إرسال ' + (files.length > 1 ? 'الملف ' + (k + 1) + ' من ' + files.length + ' — ' : '') + Math.round(off / Math.max(bytes.length, 1) * 100) + '%');
        const end = Math.min(off + chunkSize, bytes.length);
        try {
          await callEndpoint('send_file', { upload_id: id, index, last: end >= bytes.length, name: f.name, mime: f.blob.type, chunk: bytesToB64(bytes.subarray(off, end)) });
        } catch (e) {
          tries++;
          if (sizeRefused(e) && tries < MAX_TRIES) {
            if (tries % 2 === 0) chunkSize = Math.max(MIN_CHUNK, chunkSize >> 1);
            const wait = Math.min(1000 * 2 ** (tries - 1), 15000);
            busy(true, 'الخادم مشغول، إعادة المحاولة بعد ' + Math.round(wait / 1000) + ' ث…');
            await sleep(wait); continue;
          }
          e.detail = 'piece ' + (index + 1) + ', ' + Math.round(chunkSize / 1024) + ' KB, ' + tries + ' tries';
          throw e;
        }
        off = end; index++; tries = 0;
        if (off < bytes.length) await sleep(PACE_MS);
      }
    }
    busy(false);
    msg.textContent = files.length > 1 ? 'تم إرسال ' + files.length + ' ملفات إلى المحادثة مع البوت.' : 'تم إرسال الملف إلى المحادثة مع البوت.';
    msg.classList.add('on');
    if (TG.HapticFeedback) TG.HapticFeedback.notificationOccurred('success');
  } catch (e) {
    busy(false);
    let detail = '';
    try { detail = e && (e.type || e.message) ? [e.type, e.message].filter(Boolean).join(': ') : JSON.stringify(e); } catch (x) { detail = String(e); }
    if (!detail || detail === '{}') detail = String(e);
    if (e && e.detail) detail += ' (' + e.detail + ')';
    showErr(e && e.type === 'ENDPOINT_ERROR' ? e.message : 'تعذّر الإرسال إلى المحادثة. السبب: ' + detail);
  }
}
$('#sendChat').onclick = () => sendToChat(results);
